# Current release process:
# 1. `npm run pub` will call antd-tools `run pub`
# 2. antd-tools `run pub` will generate a new tag
# 3. antd-tools `run pub` will trigger `npm publish` at the same time
# 4. Then the new tag will trigger this current action
# 5. The action will generate a new release, and publish DingDing notification at the same time
#
# Note: `create` runs the workflow file from the tagged commit (not default branch).
# If a release tag was created before workflow fixes landed, delete the tag and recreate it
# on a commit that contains the fixed workflow, or run this workflow manually (workflow_dispatch).

name: DingTalk Release Notification

on:
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Re-point an existing release tag to the current default-branch commit and re-trigger notification'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.ref_type }}-${{ github.event.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  retag-for-notify:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-point release tag
        uses: actions/github-script@ed597411d8f32442ea28df23d5e7a25eafb8b504 # v8
        with:
          script: |
            const tag = context.payload.inputs.tag;
            if (!tag) {
              core.setFailed('Input `tag` is required.');
              return;
            }
            const sha = context.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });
              core.info(`Deleted tag ${tag}`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              core.info(`Tag ${tag} did not exist, creating it on ${sha}`);
            }
            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tag}`,
              sha,
            });
            core.info(`Created tag ${tag} on ${sha}`);

  release-helper:
    permissions:
      contents: write # for release-helper to create releases
    if: github.event.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release-helper action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: actions-cool/release-helper-backup
          ref: a04df78cd48267248fa46673d018e3569b036046
          path: .github/actions/release-helper
          persist-credentials: false

      - name: Send to Ant Design DingGroup
        uses: ./.github/actions/release-helper
        with:
          trigger: tag
          changelogs: 'CHANGELOG.en-US.md, CHANGELOG.zh-CN.md'
          branch: 'master, 5.x-stable, 4.x-stable'
          tag: '6*, 5*, 4*'
          latest: '6*'
          dingding-token: ${{ secrets.DINGDING_BOT_TOKEN }} ${{ secrets.DINGDING_BOT_COLLABORATOR_TOKEN }} ${{ secrets.DINGDING_BOT_MAINTAINER_TOKEN }}
          dingding-msg: CHANGELOG.zh-CN.md
          msg-title: '# Ant Design {{v}} 发布日志'
          msg-poster: 'https://gw.alipayobjects.com/mdn/rms_08e378/afts/img/A*zx7LTI_ECSAAAAAAAAAAAABkARQnAQ'
          msg-footer: '💬 前往 [**Ant Design Releases**]({{url}}) 查看更新日志'
          prettier: true
          prerelease-filter: '-, a, b, A, B'

      - name: Send to Bigfish DingGroup
        uses: ./.github/actions/release-helper
        with:
          trigger: tag
          changelogs: 'CHANGELOG.en-US.md, CHANGELOG.zh-CN.md'
          branch: 'master, 5.x-stable, 4.x-stable'
          tag: '6*, 5*, 4*'
          latest: '6*'
          dingding-token: ${{ secrets.DINGDING_BOT_BIGFISH_TOKEN }} ${{ secrets.DINGDING_BOT_BIGFISH_2_TOKEN }} ${{ secrets.DINGDING_BOT_YUNFENGDIE_TOKEN }}
          dingding-msg: CHANGELOG.zh-CN.md
          dingding-delay-minute: 10
          release: false
          conch-tag: 'conch-v6, conch-v5, conch'
          antd-conch-msg: 🐟 当前 Bigfish 内嵌 antd 版本：
          msg-title: '# Ant Design {{v}} 发布日志'
          msg-poster: 'https://gw.alipayobjects.com/mdn/rms_08e378/afts/img/A*zx7LTI_ECSAAAAAAAAAAAABkARQnAQ'
          msg-footer: '💬 前往 [**Ant Design Releases**]({{url}}) 查看更新日志'
          prettier: true
          prerelease-filter: '-, a, b, A, B'
